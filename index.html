<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Kanal Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
        .bg-card { background-color: #161b22; border: 1px solid #30363d; rounded: 0.5rem; }
        .text-muted { color: #8b949e; }
        .link-hover:hover { color: #58a6ff; text-decoration: underline; }
        .tab-active { border-bottom: 2px solid #58a6ff; color: #58a6ff; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-white">YouTube Tracker & Reactions</h1>
        
        <div class="flex gap-4 mb-6 border-b border-[#30363d] pb-2">
            <button id="tab-channels" class="tab-active pb-2 font-medium transition-colors" onclick="switchTab('channels')">Kanal-Tracker (RSS)</button>
            <button id="tab-reactions" class="text-muted pb-2 font-medium hover:text-[#c9d1d9] transition-colors" onclick="switchTab('reactions')">Manhunt Reactions</button>
        </div>

        <!-- Ansicht 1: RSS Kanäle -->
        <div id="view-channels" class="mb-8">
            <label for="channelSelect" class="block text-sm font-medium mb-2 text-muted">Kanal auswählen:</label>
            <select id="channelSelect" class="bg-[#0d1117] border border-[#30363d] text-[#c9d1d9] text-sm rounded focus:ring-[#58a6ff] focus:border-[#58a6ff] block w-full p-2.5 outline-none mb-4">
                <option value="" disabled selected>Bitte wählen...</option>
            </select>
        </div>

        <!-- Ansicht 2: Globale Suche -->
        <div id="view-reactions" class="mb-8 hidden">
            <p class="text-sm text-muted mb-4">Durchsucht ganz YouTube nach den neuesten "Manhunt Saigon" Reactions. <br>(Hinweis: Für diese globale Suche wird ein YouTube API-Key benötigt).</p>
            <div class="flex items-center gap-4">
                <button onclick="fetchReactions()" class="bg-[#238636] hover:bg-[#2ea043] text-white px-4 py-2 rounded text-sm font-medium transition-colors">Neueste Reactions suchen</button>
                <button onclick="resetApiKey()" class="text-xs text-muted underline hover:text-white transition-colors">API-Key ändern/löschen</button>
            </div>
        </div>

        <div id="videoContainer" class="space-y-4">
            <p class="text-muted text-sm italic" id="start-text">Wähle einen Kanal oder suche nach Reactions, um Videos zu laden.</p>
        </div>
    </div>

    <script>
        const channels = {
            "FritzMeineckeLive": "UCGRb1WmL-v6AxZRLbcdXD_Q",
            "NerdsHeaven.de": "UCJgscJUwcnegPlrQLouVlfg",
            "Cliff Beats Classics": "UCka4yqPXK4DujPIsrB6xu-Q",
            "LeFloidLive": "UC8XoF1y5K_J0A10a6kQ-nkw",
            "Manhunt (Saigon)": "UCnXFGVa7VEoiM2Adftm_Hug" 
        };

        const select = document.getElementById('channelSelect');
        const container = document.getElementById('videoContainer');

        for (const [name, id] of Object.entries(channels)) {
            const option = document.createElement('option');
            option.value = id;
            option.textContent = name;
            select.appendChild(option);
        }

        function switchTab(tab) {
            document.getElementById('view-channels').classList.toggle('hidden', tab !== 'channels');
            document.getElementById('view-reactions').classList.toggle('hidden', tab !== 'reactions');
            
            document.getElementById('tab-channels').className = tab === 'channels' ? 'tab-active pb-2 font-medium transition-colors' : 'text-muted pb-2 font-medium hover:text-[#c9d1d9] transition-colors';
            document.getElementById('tab-reactions').className = tab === 'reactions' ? 'tab-active pb-2 font-medium transition-colors' : 'text-muted pb-2 font-medium hover:text-[#c9d1d9] transition-colors';
            
            container.innerHTML = '';
        }

        select.addEventListener('change', (e) => {
            const isManhunt = e.target.options[e.target.selectedIndex].text.includes("Manhunt");
            fetchVideosRSS(e.target.value, isManhunt);
        });

        function renderVideos(videos, source) {
            if (videos.length === 0) {
                container.innerHTML = '<p class="text-muted text-sm">Keine Videos gefunden.</p>';
                return;
            }
            
            videos.forEach(video => {
                // Unterscheidung zwischen RSS und API Datenstruktur
                const pubDate = source === 'rss' ? video.pubDate : video.snippet.publishedAt;
                const title = source === 'rss' ? video.title : video.snippet.title;
                const link = source === 'rss' ? video.link : `https://www.youtube.com/watch?v=${video.id.videoId}`;
                const channelName = source === 'rss' ? video.author : video.snippet.channelTitle;

                const date = new Date(pubDate).toLocaleDateString('de-DE', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });

                const card = document.createElement('div');
                card.className = 'bg-card p-4 flex flex-col gap-2 transition-colors hover:border-[#58a6ff]';
                card.innerHTML = `
                    <a href="${link}" target="_blank" class="text-lg font-semibold text-[#c9d1d9] link-hover line-clamp-2">
                        ${title}
                    </a>
                    <span class="text-xs text-muted">Von: <strong class="text-white">${channelName}</strong> | Hochgeladen am: ${date} Uhr</span>
                `;
                container.appendChild(card);
            });
        }

        function fetchVideosRSS(channelId, isManhunt = false) {
            container.innerHTML = '<p class="text-muted text-sm animate-pulse">Lade Videos...</p>';
            const rssUrl = encodeURIComponent(`https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`);
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status !== 'ok') throw new Error('Feed konnte nicht geladen werden.');
                    container.innerHTML = '';
                    let videos = data.items;
                    if (isManhunt) {
                        videos = videos.filter(video => video.title.toLowerCase().includes("saigon"));
                    } else {
                        videos = videos.slice(0, 5); 
                    }
                    renderVideos(videos, 'rss');
                })
                .catch(error => {
                    container.innerHTML = `<p class="text-red-400 text-sm">Fehler: ${error.message}</p>`;
                });
        }

        function resetApiKey() {
            localStorage.removeItem('ytApiKey');
            alert("API-Key wurde gelöscht. Beim nächsten Suchvorgang wirst du neu gefragt.");
        }

        function fetchReactions() {
            let apiKey = localStorage.getItem('ytApiKey');
            if (!apiKey) {
                apiKey = prompt("Um ganz YouTube global nach Reactions zu durchsuchen, wird hierfür der YouTube API-Key benötigt.\n\nBitte gib deinen Key ein (er wird nur lokal in deinem Browser gespeichert):");
                if (!apiKey) return;
                localStorage.setItem('ytApiKey', apiKey);
            }

            container.innerHTML = '<p class="text-muted text-sm animate-pulse">Durchsuche YouTube nach neuesten Reactions...</p>';
            
            const query = encodeURIComponent("Manhunt Saigon reaction");
            // Sucht nach Videos, sortiert nach neuestem Datum
            const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${query}&order=date&type=video&maxResults=10&key=${apiKey}`;

            fetch(searchUrl)
                .then(response => {
                    if (!response.ok) throw new Error('API Fehler. Eventuell ist der API-Key ungültig oder das Limit erreicht.');
                    return response.json();
                })
                .then(data => {
                    container.innerHTML = '';
                    renderVideos(data.items, 'api');
                })
                .catch(error => {
                    container.innerHTML = `<p class="text-red-400 text-sm">Fehler: ${error.message}</p>`;
                    localStorage.removeItem('ytApiKey');
                });
        }
    </script>
</body>
</html>
