<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Kanal Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
        .bg-card { background-color: #161b22; border: 1px solid #30363d; rounded: 0.5rem; }
        .text-muted { color: #8b949e; }
        .link-hover:hover { color: #58a6ff; text-decoration: underline; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold mb-2 text-white">YouTube Tracker</h1>
        <p class="text-muted text-sm mb-8">Klicke auf einen Kanal, um die Videos aufzuklappen. Die Videos bleiben nach dem Laden stehen, bis du die Seite neu lädst.</p>

        <div id="channels-container" class="space-y-4 mb-8">
            <!-- Accordions werden hier generiert -->
        </div>

        <hr class="border-[#30363d] my-8">

        <h2 class="text-xl font-bold mb-4 text-white">Manhunt Reactions (Globale Suche)</h2>
        <div id="view-reactions" class="bg-card p-6 border border-[#30363d] rounded-lg">
            <p class="text-sm text-muted mb-4">Durchsucht ganz YouTube nach den neuesten "Manhunt Saigon" Reactions. <br>(Benötigt einen YouTube API-Key).</p>
            <div class="flex items-center gap-4 mb-6">
                <button onclick="fetchReactions()" class="bg-[#238636] hover:bg-[#2ea043] text-white px-4 py-2 rounded text-sm font-medium transition-colors">Neueste Reactions suchen</button>
                <button onclick="resetApiKey()" class="text-xs text-muted underline hover:text-white transition-colors">API-Key ändern/löschen</button>
            </div>
            <div id="reactionsContainer" class="space-y-4">
                <!-- Reactions werden hier geladen -->
            </div>
        </div>
    </div>

    <script>
        const channels = {
            "FritzMeineckeLive": "UCGRb1WmL-v6AxZRLbcdXD_Q",
            "NerdsHeaven.de": "UCc4vLamPzjYvcOFZiOD65Pg", // Korrigierte Hauptkanal ID
            "Cliff Beats Classics": "UCka4yqPXK4DujPIsrB6xu-Q",
            "LeFloidLive": "UCRkGBOn8P6IBriIh3ACchjw", // Korrigierte LeFloidLive ID
            "Manhunt (Saigon)": "UCnXFGVa7VEoiM2Adftm_Hug" 
        };

        const channelsContainer = document.getElementById('channels-container');

        // Accordion-Menüs für jeden Kanal erstellen
        for (const [name, id] of Object.entries(channels)) {
            const details = document.createElement('details');
            details.className = "bg-[#0d1117] border border-[#30363d] rounded-lg overflow-hidden group";
            
            const summary = document.createElement('summary');
            summary.className = "p-4 font-semibold text-[#c9d1d9] bg-[#161b22] cursor-pointer hover:bg-[#1c2128] transition-colors flex justify-between items-center";
            summary.innerHTML = `
                <span>${name}</span>
                <span class="text-xs text-muted group-open:rotate-180 transition-transform">▼</span>
            `;
            
            const content = document.createElement('div');
            content.className = "p-4 space-y-4 border-t border-[#30363d]";
            content.id = `content-${id}`;
            content.innerHTML = `<p class="text-sm text-muted">Klicke zum Laden...</p>`;

            // Lade Daten nur beim ERSTEN Aufklappen, danach bleiben sie bestehen
            let loaded = false;
            details.addEventListener('toggle', (e) => {
                if (details.open && !loaded) {
                    loaded = true;
                    fetchVideosRSS(id, content, name.includes("Manhunt"));
                }
            });

            details.appendChild(summary);
            details.appendChild(content);
            channelsContainer.appendChild(details);
        }

        function createVideoCard(video, source) {
            const pubDate = source === 'rss' ? video.pubDate : video.snippet.publishedAt;
            const title = source === 'rss' ? video.title : video.snippet.title;
            const link = source === 'rss' ? video.link : `https://www.youtube.com/watch?v=${video.id.videoId}`;
            const channelName = source === 'rss' ? video.author : video.snippet.channelTitle;

            const date = new Date(pubDate).toLocaleDateString('de-DE', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });

            return `
                <div class="bg-card p-4 flex flex-col gap-1 transition-colors hover:border-[#58a6ff]">
                    <a href="${link}" target="_blank" class="text-base font-semibold text-[#c9d1d9] link-hover line-clamp-2">
                        ${title}
                    </a>
                    <span class="text-xs text-muted">
                        ${source === 'api' ? `Von: <strong class="text-white">${channelName}</strong> | ` : ''}Hochgeladen am: ${date} Uhr
                    </span>
                </div>
            `;
        }

        function fetchVideosRSS(channelId, containerElement, isManhunt) {
            containerElement.innerHTML = '<p class="text-muted text-sm animate-pulse">Lade Videos...</p>';
            const rssUrl = encodeURIComponent(`https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`);
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status !== 'ok') throw new Error('Feed konnte nicht geladen werden.');
                    
                    let videos = data.items;
                    if (isManhunt) {
                        videos = videos.filter(video => video.title.toLowerCase().includes("saigon"));
                    } else {
                        videos = videos.slice(0, 5); 
                    }
                    
                    if (videos.length === 0) {
                        containerElement.innerHTML = '<p class="text-muted text-sm">Keine Videos gefunden.</p>';
                        return;
                    }

                    containerElement.innerHTML = videos.map(v => createVideoCard(v, 'rss')).join('');
                })
                .catch(error => {
                    containerElement.innerHTML = `<p class="text-red-400 text-sm">Fehler beim Laden. ID korrekt?</p>`;
                });
        }

        function resetApiKey() {
            localStorage.removeItem('ytApiKey');
            alert("API-Key wurde gelöscht. Beim nächsten Suchvorgang wirst du neu gefragt.");
        }

        function fetchReactions() {
            const container = document.getElementById('reactionsContainer');
            let apiKey = localStorage.getItem('ytApiKey');
            if (!apiKey) {
                apiKey = prompt("YouTube API-Key eingeben (wird nur lokal im Browser gespeichert):");
                if (!apiKey) return;
                localStorage.setItem('ytApiKey', apiKey);
            }

            container.innerHTML = '<p class="text-muted text-sm animate-pulse">Durchsuche YouTube nach neuesten Reactions...</p>';
            
            const query = encodeURIComponent("Manhunt Saigon reaction");
            const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${query}&order=date&type=video&maxResults=10&key=${apiKey}`;

            fetch(searchUrl)
                .then(response => {
                    if (!response.ok) throw new Error('API Fehler. Eventuell ist der API-Key ungültig oder das Limit erreicht.');
                    return response.json();
                })
                .then(data => {
                    if (data.items.length === 0) {
                        container.innerHTML = '<p class="text-muted text-sm">Keine Reactions gefunden.</p>';
                        return;
                    }
                    container.innerHTML = data.items.map(v => createVideoCard(v, 'api')).join('');
                })
                .catch(error => {
                    container.innerHTML = `<p class="text-red-400 text-sm">Fehler: ${error.message}</p>`;
                    localStorage.removeItem('ytApiKey');
                });
        }
    </script>
</body>
</html>
